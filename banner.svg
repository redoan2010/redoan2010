<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="78%" cy="50%" r="80%">
      <stop offset="0" stop-color="#101a33"/>
      <stop offset="0.6" stop-color="#070b16"/>
      <stop offset="1" stop-color="#04060c"/>
    </radialGradient>
    <linearGradient id="ttl" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#9ff8ff"/>
      <stop offset="1" stop-color="#9a8cff"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00f0ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="420" rx="14"/></clipPath>

    <style>
      .mono { font-family: 'Courier New', Consolas, monospace; }
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .spin   { transform-box: fill-box; transform-origin: center; animation: spin 40s linear infinite; }
      .spinr  { transform-box: fill-box; transform-origin: center; animation: spin 26s linear infinite reverse; }
      .spinf  { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite; }
      .prop   { transform-box: fill-box; transform-origin: center; animation: spin 0.35s linear infinite; }
      .propr  { transform-box: fill-box; transform-origin: center; animation: spin 0.35s linear infinite reverse; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .float { animation: float 4s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(-8px); } 50% { transform: translateY(8px); } }
      .gridmove { animation: gm 6s linear infinite; }
      @keyframes gm { to { transform: translateY(40px); } }
      .scanline { animation: sc 5s linear infinite; }
      @keyframes sc { from { transform: translateY(-120px); } to { transform: translateY(440px); } }
      .blink { animation: bl 1.2s steps(2, start) infinite; }
      @keyframes bl { to { opacity: 0.15; } }
      .pulse { animation: pu 3s ease-in-out infinite; }
      @keyframes pu { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
      .sub { opacity: 0; animation: sub 12s infinite backwards; }
      .s2 { animation-delay: 3s; } .s3 { animation-delay: 6s; } .s4 { animation-delay: 9s; }
      @keyframes sub {
        0%   { opacity: 0; transform: translateY(10px); }
        3%   { opacity: 1; transform: translateY(0); }
        22%  { opacity: 1; transform: translateY(0); }
        25%  { opacity: 0; transform: translateY(-10px); }
        100% { opacity: 0; }
      }
      .glitchA { animation: gA 6s infinite; }
      .glitchB { animation: gB 6s infinite; }
      @keyframes gA { 0%,90%,100% { transform: translate(0,0); opacity: 0; } 92% { transform: translate(-5px,1px); opacity: .7; } 95% { transform: translate(4px,-1px); opacity: .6; } }
      @keyframes gB { 0%,90%,100% { transform: translate(0,0); opacity: 0; } 93% { transform: translate(5px,-1px); opacity: .7; } 96% { transform: translate(-4px,1px); opacity: .6; } }
      .bar { stroke-dasharray: 300; stroke-dashoffset: 300; animation: bar 4s ease-in-out infinite; }
      .bar2 { animation-delay: .6s; } .bar3 { animation-delay: 1.2s; }
      @keyframes bar { 0% { stroke-dashoffset: 300; } 60%,100% { stroke-dashoffset: 40; } }
      .dash { stroke-dasharray: 14 10; animation: dm 1.5s linear infinite; }
      @keyframes dm { to { stroke-dashoffset: -24; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <g class="gridmove"><rect x="0" y="-40" width="1200" height="500" fill="url(#grid)"/></g>

    <!-- scanning beam -->
    <rect class="scanline" x="0" y="0" width="1200" height="120" fill="url(#scan)"/>

    <!-- HUD rings + drone -->
    <g transform="translate(930 210)">
      <circle r="190" fill="none" stroke="#00f0ff" stroke-opacity="0.15"/>
      <circle class="spin" r="170" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="4 14" stroke-opacity="0.7"/>
      <circle class="spinr" r="145" fill="none" stroke="#9a8cff" stroke-width="3" stroke-dasharray="90 40 20 40" stroke-opacity="0.8"/>
      <circle class="spinf" r="118" fill="none" stroke="#ffb020" stroke-width="2" stroke-dasharray="30 200" stroke-opacity="0.9"/>
      <circle r="95" fill="none" stroke="#00f0ff" stroke-opacity="0.25" stroke-dasharray="2 6"/>
      <path d="M-200 0H-60M60 0H200M0 -200V-60M0 60V200" stroke="#00f0ff" stroke-opacity="0.18"/>

      <g class="float" filter="url(#glow)">
        <!-- arms -->
        <path d="M-55 -55L55 55M55 -55L-55 55" stroke="#9ff8ff" stroke-width="5" stroke-linecap="round"/>
        <!-- motors + props -->
        <g transform="translate(-55 -55)"><circle r="9" fill="#0a1224" stroke="#00f0ff" stroke-width="2"/><g class="prop"><ellipse rx="40" ry="5" fill="#00f0ff" fill-opacity="0.55"/><ellipse rx="5" ry="40" fill="#00f0ff" fill-opacity="0.55"/></g></g>
        <g transform="translate(55 -55)"><circle r="9" fill="#0a1224" stroke="#00f0ff" stroke-width="2"/><g class="propr"><ellipse rx="40" ry="5" fill="#9a8cff" fill-opacity="0.6"/><ellipse rx="5" ry="40" fill="#9a8cff" fill-opacity="0.6"/></g></g>
        <g transform="translate(-55 55)"><circle r="9" fill="#0a1224" stroke="#00f0ff" stroke-width="2"/><g class="propr"><ellipse rx="40" ry="5" fill="#9a8cff" fill-opacity="0.6"/><ellipse rx="5" ry="40" fill="#9a8cff" fill-opacity="0.6"/></g></g>
        <g transform="translate(55 55)"><circle r="9" fill="#0a1224" stroke="#00f0ff" stroke-width="2"/><g class="prop"><ellipse rx="40" ry="5" fill="#00f0ff" fill-opacity="0.55"/><ellipse rx="5" ry="40" fill="#00f0ff" fill-opacity="0.55"/></g></g>
        <!-- body -->
        <rect x="-22" y="-30" width="44" height="60" rx="10" fill="#0b1630" stroke="#00f0ff" stroke-width="2"/>
        <rect x="-12" y="-20" width="24" height="18" rx="3" fill="#00f0ff" fill-opacity="0.25" stroke="#00f0ff" stroke-opacity="0.8"/>
        <circle class="blink" cx="0" cy="14" r="4" fill="#ffb020"/>
        <path d="M0 -30V-42" stroke="#ffb020" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- target marks -->
      <g stroke="#00f0ff" stroke-width="2" fill="none" class="pulse">
        <path d="M-120 -100v-18h18M120 -100v-18h-18M-120 100v18h18M120 100v18h-18"/>
      </g>
    </g>

    <!-- text -->
    <text x="64" y="118" class="mono" font-size="15" letter-spacing="5" fill="#00f0ff" opacity="0.9">// MAKER · FIRMWARE TINKERER · HARDWARE HACKER</text>

    <g class="sans" font-size="96" font-weight="800" letter-spacing="14">
      <text x="64" y="212" fill="#ff2e88" class="glitchA">REDOAN</text>
      <text x="64" y="212" fill="#00f0ff" class="glitchB">REDOAN</text>
      <text x="64" y="212" fill="url(#ttl)" filter="url(#glow)">REDOAN</text>
    </g>

    <g class="mono" font-size="24" fill="#d6f9ff">
      <text x="68" y="262" class="sub">&gt; Custom STM32 flight controllers</text>
      <text x="68" y="262" class="sub s2">&gt; INAV drones · FPV · autonomous GPS</text>
      <text x="68" y="262" class="sub s3">&gt; ESP32 · SDR · CNC · motherboard mods</text>
      <text x="68" y="262" class="sub s4">&gt; Founder @ BELTA · DIY electronics, BD</text>
      <rect class="blink" x="68" y="272" width="14" height="3" fill="#00f0ff"/>
    </g>

    <!-- telemetry bars -->
    <g class="mono" font-size="12" fill="#7fb4c4" letter-spacing="2">
      <text x="68" y="318">FIRMWARE</text><path class="bar" d="M170 314H340" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
      <text x="68" y="342">HARDWARE</text><path class="bar bar2" d="M170 338H340" stroke="#9a8cff" stroke-width="6" stroke-linecap="round"/>
      <text x="68" y="366">BUILD LOG</text><path class="bar bar3" d="M170 362H340" stroke="#ffb020" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- bottom status strip -->
    <line class="dash" x1="0" y1="392" x2="1200" y2="392" stroke="#00f0ff" stroke-opacity="0.35"/>
    <g class="mono" font-size="12" fill="#7fb4c4" letter-spacing="2">
      <circle class="blink" cx="68" cy="408" r="4" fill="#38ff9c"/>
      <text x="82" y="412">SYS.ONLINE</text>
      <text x="230" y="412">FC: STM32F411</text>
      <text x="400" y="412">FW: INAV 6.0</text>
      <text x="560" y="412">IMU: MPU6050</text>
      <text x="730" y="412">GPS: NEO-7M</text>
      <text x="890" y="412">LINK: ELRS</text>
      <text x="1030" y="412" class="pulse" fill="#ffb020">DHAKA · BD</text>
    </g>

    <!-- corner brackets -->
    <g stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.8">
      <path d="M14 44V14H44M1156 14H1186V44M14 376V406H44M1156 406H1186V376"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="14" fill="none" stroke="#00f0ff" stroke-opacity="0.3"/>
</svg>
